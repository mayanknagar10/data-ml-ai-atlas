name: Build, validate and deploy Data, ML & AI Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build generated artifacts
        run: python scripts/build.py

      - name: Validate curriculum and generated book
        run: python validate.py

      - name: Validate generated code labs
        run: python scripts/check_labs.py

      - name: Validate generated site links
        run: python scripts/check_site.py

      - name: Validate JavaScript syntax
        run: node --check app.js && node --check analyzer.js

      - name: Validate resume + JD analyzer
        run: node scripts/check_analyzer.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
