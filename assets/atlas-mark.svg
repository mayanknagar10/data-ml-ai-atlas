  </defs>
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bg)"/>
  <path d="M11 43C17 14 46 6 55 29C61 46 43 57 25 52" fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="1.6" stroke-linecap="round"/>
  <g fill="none" stroke="url(#edge)" stroke-width="3.25" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M17 47L32 15L47 47"/>
    <path d="M23.5 33.5H40.5"/>
  </g>
  <g fill="#fff" stroke="#dbeafe" stroke-width="1.2">
    <circle cx="32" cy="15" r="3.3"/>
    <circle cx="17" cy="47" r="3.3"/>
    <circle cx="47" cy="47" r="3.3"/>
    <circle cx="23.5" cy="33.5" r="2.5"/>
    <circle cx="40.5" cy="33.5" r="2.5"/>
  </g>
  <circle cx="32" cy="33.5" r="2" fill="#a7f3d0"/>
</svg>
